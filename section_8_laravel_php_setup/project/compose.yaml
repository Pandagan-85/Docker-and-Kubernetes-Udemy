services:
  server:
    image: "nginx:stable-alpine"
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  php:
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
    # reach source code from host machine
    volumes:
      # delegated process in batches not instantly
      - ./src:/var/www/html:delegated

  mysql:
    image: "mysql:5.7"
    env_file:
      - ./env/mysql.env
